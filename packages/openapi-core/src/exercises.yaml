openapi: 3.1.0
info:
  title: Exercises API
  version: 0.1.0
  description: Adversary emulation scheduling, scope, and outcomes.
  license:
    name: Proprietary
    url: https://vouchstone.local/license
  x-domain: exr
servers:
- url: https://api.vouchstone.local
  description: Local / starter API
security:
- bearerJWT: []
- apiKey: []
tags:
- name: Exercises
  description: Adversary emulation scheduling, scope, and outcomes
paths:
  /v1/exercises:
    get:
      operationId: listEmulationExercises
      tags:
      - Exercises
      security:
      - bearerJWT: []
      parameters:
      - $ref: ./common/parameters.yaml#/components/parameters/Cursor
      - $ref: ./common/parameters.yaml#/components/parameters/Limit
      - name: status
        in: query
        schema:
          type: string
          enum:
          - scheduled
          - executed
          - deferred
          - missed
          - expired
      responses:
        '200':
          description: Exercises page
          content:
            application/json:
              schema:
                $ref: ./exercises.schemas.yaml#/components/schemas/ListEnvelopeEmulationExercise
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
      x-repository: EmulationExercise
      summary: List Emulation Exercises
    post:
      operationId: scheduleEmulationExercise
      tags:
      - Exercises
      description: Schedule an independent adversary emulation with a defined scope over named priority
        assets. A missed due date expires the associated evidence.
      security:
      - bearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./exercises.schemas.yaml#/components/schemas/EmulationExerciseCreate
      responses:
        '201':
          description: Exercise scheduled
          content:
            application/json:
              schema:
                $ref: ./exercises.schemas.yaml#/components/schemas/DataEnvelopeEmulationExercise
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
      x-repository: EmulationExercise
      summary: Schedule an independent adversary emulation with a defined scope over named priority assets.
        A mi...
  /v1/exercises/{exerciseId}/outcome:
    parameters:
    - $ref: '#/components/parameters/ExerciseId'
    post:
      operationId: recordExerciseOutcome
      tags:
      - Exercises
      security:
      - bearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./exercises.schemas.yaml#/components/schemas/ExerciseOutcomeCreate
      responses:
        '201':
          description: Outcome and findings recorded
          content:
            application/json:
              schema:
                $ref: ./exercises.schemas.yaml#/components/schemas/DataEnvelopeEmulationExercise
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
      x-repository: EmulationExercise
      summary: Record Exercise Outcome
components:
  securitySchemes:
    bearerJWT:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerJWT
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
  parameters:
    ExerciseId:
      name: exerciseId
      in: path
      required: true
      schema:
        type: string

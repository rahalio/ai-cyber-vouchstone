openapi: 3.1.0
info:
  title: Coverage API
  version: 0.1.0
  description: Detection coverage and named gaps over priority assets.
  license:
    name: Proprietary
    url: https://vouchstone.local/license
  x-domain: cov
servers:
- url: https://api.vouchstone.local
  description: Local / starter API
security:
- bearerJWT: []
- apiKey: []
tags:
- name: Coverage
  description: Detection coverage and named gaps over priority assets
paths:
  /v1/coverage:
    get:
      operationId: listDetectionCoverage
      tags:
      - Coverage
      description: Detection coverage expressed per named priority asset rather than per network or control
        count.
      security:
      - bearerJWT: []
      parameters:
      - $ref: ./common/parameters.yaml#/components/parameters/Cursor
      - $ref: ./common/parameters.yaml#/components/parameters/Limit
      - name: assetId
        in: query
        schema:
          type: string
      - name: hasGap
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Coverage records page
          content:
            application/json:
              schema:
                $ref: ./coverage.schemas.yaml#/components/schemas/ListEnvelopeDetectionCoverage
        '403':
          $ref: ./common/responses.yaml#/components/responses/Forbidden
      x-repository: DetectionCoverage
      summary: Detection coverage expressed per named priority asset rather than per network or control
        count.
  /v1/coverage/gaps:
    get:
      operationId: listCoverageGaps
      tags:
      - Coverage
      description: Highly restricted. The assembled gap list is a target-selection document for an insider
        and every read is logged.
      security:
      - bearerJWT: []
      parameters:
      - $ref: ./common/parameters.yaml#/components/parameters/Cursor
      - $ref: ./common/parameters.yaml#/components/parameters/Limit
      responses:
        '200':
          description: Named coverage gaps within the caller's compartment
          content:
            application/json:
              schema:
                $ref: ./coverage.schemas.yaml#/components/schemas/ListEnvelopeCoverageGap
        '403':
          $ref: ./common/responses.yaml#/components/responses/Forbidden
      x-repository: CoverageGap
      summary: Highly restricted. The assembled gap list is a target-selection document for an insider
        and every...
components:
  securitySchemes:
    bearerJWT:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerJWT
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey

openapi: 3.1.0
info:
  title: Shared security schemes
  version: 0.1.0
  description: API-key and Bearer JWT auth for tenant-scoped APIs.
paths: {}
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Tenant API key. Implies tenant isolation — no cross-tenant reads.
        Operator browser sessions use Bearer JWT (see identity `/v0/auth/*`).
    bearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Operator Bearer JWT from identity `/v0/auth/login`.

openapi: 3.1.0
info:
  title: Attribution API
  version: 0.1.0
  description: Incident discoverer attribution and measured detection intervals.
  license:
    name: Proprietary
    url: https://vouchstone.local/license
  x-domain: atr
servers:
- url: https://api.vouchstone.local
  description: Local / starter API
security:
- bearerJWT: []
- apiKey: []
tags:
- name: Attribution
  description: Incident discoverer attribution and measured detection intervals
paths:
  /v1/incidents/{incidentId}/attribution:
    parameters:
    - $ref: '#/components/parameters/IncidentId'
    post:
      operationId: attributeIncidentDiscovery
      tags:
      - Attribution
      description: Records who discovered a confirmed successful attack. Captured at intake by the incident
        process, outside the control of the function whose share it measures.
      security:
      - apiKey: []
      - bearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./attribution.schemas.yaml#/components/schemas/DiscovererAttributionCreate
      responses:
        '201':
          description: Attribution recorded and detection interval measured
          content:
            application/json:
              schema:
                $ref: ./attribution.schemas.yaml#/components/schemas/DataEnvelopeDiscovererAttribution
        '409':
          $ref: ./common/responses.yaml#/components/responses/Conflict
      x-repository: DiscovererAttribution
      summary: Records who discovered a confirmed successful attack. Captured at intake by the incident
        process,...
  /v1/attribution/discovery-share:
    get:
      operationId: getDiscoveryShareReport
      tags:
      - Attribution
      description: Standing metric of what share of confirmed successful attacks the security function
        discovered itself, with the remainder broken out by discoverer class.
      security:
      - bearerJWT: []
      parameters:
      - name: period
        in: query
        schema:
          type: string
          example: 2026
      responses:
        '200':
          description: Discovery share report
          content:
            application/json:
              schema:
                $ref: ./attribution.schemas.yaml#/components/schemas/DataEnvelopeDiscoveryShareReport
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
      x-repository: none
      summary: Standing metric of what share of confirmed successful attacks the security function discovered
        it...
  /v1/attribution/detection-intervals:
    get:
      operationId: getDetectionIntervalDistribution
      tags:
      - Attribution
      description: Measured time to detect as a distribution, never a surveyed estimate or a single average.
      security:
      - bearerJWT: []
      parameters:
      - name: period
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Detection interval distribution
          content:
            application/json:
              schema:
                $ref: ./attribution.schemas.yaml#/components/schemas/DataEnvelopeDetectionIntervalDistribution
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
      x-repository: none
      summary: Measured time to detect as a distribution, never a surveyed estimate or a single average.
components:
  securitySchemes:
    bearerJWT:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerJWT
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
  parameters:
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string

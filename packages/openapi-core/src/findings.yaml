openapi: 3.1.0
info:
  title: Findings API
  version: 0.1.0
  description: Findings, remediation ownership, and score suppression.
  license:
    name: Proprietary
    url: https://vouchstone.local/license
  x-domain: fnd
servers:
- url: https://api.vouchstone.local
  description: Local / starter API
security:
- bearerJWT: []
- apiKey: []
tags:
- name: Findings
  description: Findings, remediation ownership, and score suppression
paths:
  /v1/findings:
    get:
      operationId: listFindings
      tags:
      - Findings
      security:
      - bearerJWT: []
      parameters:
      - $ref: ./common/parameters.yaml#/components/parameters/Cursor
      - $ref: ./common/parameters.yaml#/components/parameters/Limit
      - name: state
        in: query
        schema:
          type: string
          enum:
          - open
          - overdue
          - closed
          - accepted_risk
      - name: domain
        in: query
        schema:
          $ref: ./common/vouchstone-primitives.yaml#/components/schemas/DomainKey
      responses:
        '200':
          description: Findings page with suppressed domain scores
          content:
            application/json:
              schema:
                $ref: ./findings.schemas.yaml#/components/schemas/ListEnvelopeFinding
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
      x-repository: Finding
      summary: List Findings
    post:
      operationId: raiseFinding
      tags:
      - Findings
      security:
      - bearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./common/vouchstone-primitives.yaml#/components/schemas/FindingCreate
      responses:
        '201':
          description: Finding raised with a named owner and due date
          content:
            application/json:
              schema:
                $ref: ./findings.schemas.yaml#/components/schemas/DataEnvelopeFinding
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
      x-repository: Finding
      summary: Raise Finding
  /v1/findings/{findingId}/remediation:
    parameters:
    - $ref: '#/components/parameters/FindingId'
    put:
      operationId: updateRemediationCommitment
      tags:
      - Findings
      security:
      - bearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./findings.schemas.yaml#/components/schemas/RemediationCommitment
      responses:
        '200':
          description: Remediation commitment updated
          content:
            application/json:
              schema:
                $ref: ./findings.schemas.yaml#/components/schemas/DataEnvelopeFinding
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
      x-repository: Finding
      summary: Update Remediation Commitment
components:
  securitySchemes:
    bearerJWT:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerJWT
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
  parameters:
    FindingId:
      name: findingId
      in: path
      required: true
      schema:
        type: string

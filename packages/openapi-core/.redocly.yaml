apis:
  identity:
    root: src/identity.yaml
  assets:
    root: src/assets.yaml
  evidence:
    root: src/evidence.yaml
  domains:
    root: src/domains.yaml
  coverage:
    root: src/coverage.yaml
  attribution:
    root: src/attribution.yaml
  exercises:
    root: src/exercises.yaml
  findings:
    root: src/findings.yaml
  allocation:
    root: src/allocation.yaml
  assurance:
    root: src/assurance.yaml
  governance:
    root: src/governance.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
